name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: the job only checks out and runs checks, so read-only
# contents access is all GITHUB_TOKEN needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The package publishes the compiled core from lib/ (committed so
      # git-dependency consumers need no build step). Fail if it drifts from
      # src/, which would silently ship stale code to consumers.
      - name: Verify committed core build is up to date
        run: |
          bun run build:core
          # Fail on any change under lib/ — tracked diffs AND untracked files
          # (a new emitted module missing from the commit).
          if [[ -n "$(git status --porcelain --untracked-files=all -- lib)" ]]; then
            git status --short --untracked-files=all -- lib
            exit 1
          fi
